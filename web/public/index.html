<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · Andreas Duess</title>
<meta name="description" content="The books on Andreas Duess's shelves at home, one shelf per section.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='6' width='5' height='21' fill='%23b5523b'/><rect x='11' y='4' width='6' height='23' fill='%23d9b26f'/><rect x='18' y='8' width='4' height='19' fill='%233f6b5c'/><rect x='23' y='6' width='4' height='21' fill='%232f4a6b' transform='rotate(8 25 16)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="library">
  <header class="masthead">
    <p class="eyebrow">Andreas Duess</p>
    <h1>Library</h1>
    <p class="lede"><span id="count">The</span> books from my shelves at home, one shelf per section. Click a spine to take a book out.</p>
    <nav id="sections" aria-label="Sections"></nav>
  </header>
  <div id="shelves"></div>
  <div class="tip" id="tip" role="tooltip" hidden><p class="tip-title"></p><p class="tip-author"></p><p class="tip-meta"></p></div>
  <footer class="foot">Covers from <a href="https://openlibrary.org">Open Library</a>. <a href="https://duess.com">duess.com</a></footer>
</main>

<div id="stage" hidden>
  <div class="veil"></div>
  <div class="scene"><div class="book3d" id="book3d"></div></div>
  <aside class="note" id="note" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <button class="close" id="close" aria-label="Put the book back">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <p class="note-section" id="note-section"></p>
    <h2 id="note-title"></h2>
    <p class="note-author" id="note-author"></p>
    <p class="note-blurb" id="note-blurb"></p>
    <div class="note-mine" id="note-mine" hidden><p class="note-label">My note</p><p id="note-mine-text"></p></div>
    <p class="note-facts" id="note-facts"></p>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
